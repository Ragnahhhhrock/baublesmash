name = "baublesmash-scores"
main = "worker.js"
compatibility_date = "2026-11-01"

# Create the KV namespace in the dashboard (or `wrangler kv namespace create SCORES`) and paste its id here.
[[kv_namespaces]]
binding = "SCORES"
id = "REPLACE_WITH_KV_ID"

[[routes]]
pattern = "api.baublesmash.com"
custom_domain = true
